name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check that the tag matches package.json
        # The binary reports the version from package.json (injected at bundle
        # time), so a tag that disagrees with it would ship a mislabelled build.
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Releasing version $PKG_VERSION"

      - name: Build
        run: npm run build

      - name: Run tests
        # Unit and integration tests run against local fakes; no network needed.
        # The opt-in live smoke test stays off (LIVE_TESTS unset).
        run: npm test

      - name: Bundle with esbuild
        run: npm run bundle

      - name: Create binaries with pkg
        run: |
          mkdir -p bin
          npx pkg dist/bundled.cjs \
            --targets node20-linux-x64,node20-linux-arm64 \
            --compress GZip \
            --output bin/bch-ipfs-scrape
          mv bin/bch-ipfs-scrape-x64 bin/bch-ipfs-scrape-linux-x64
          mv bin/bch-ipfs-scrape-arm64 bin/bch-ipfs-scrape-linux-arm64
          chmod +x bin/*
          ls -lah bin/

      - name: Smoke-test the x64 binary
        run: |
          REPORTED="$(./bin/bch-ipfs-scrape-linux-x64 --version)"
          echo "$REPORTED"
          [ "$REPORTED" = "bch-ipfs-scrape v${GITHUB_REF#refs/tags/v}" ]

      - name: Create release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: bin/*
          body: |
            ## bch-ipfs-scrape ${{ github.ref_name }}

            Standalone binaries for Linux (no Node.js required).

            ### Downloads
            - **Linux x64**: `bch-ipfs-scrape-linux-x64`
            - **Linux ARM64**: `bch-ipfs-scrape-linux-arm64`

            ### Installation
            ```bash
            # Download the binary for your architecture
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/bch-ipfs-scrape-linux-x64

            # Make it executable
            chmod +x bch-ipfs-scrape-linux-x64

            # Optionally move to your PATH
            sudo mv bch-ipfs-scrape-linux-x64 /usr/local/bin/bch-ipfs-scrape
            ```

            ### Usage
            Run `./bch-ipfs-scrape-linux-x64` (or `bch-ipfs-scrape` if installed to PATH)

            See [README](https://github.com/${{ github.repository }}) for full documentation.
